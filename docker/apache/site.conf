ServerName localhost

<VirtualHost *:80>
    DocumentRoot "/workspace/public"
    DirectoryIndex index.php index.html

    # 本番と同じ /wk/ 配下でもLaravelを公開する
    RedirectMatch 302 ^/wk$ /wk/
    Alias "/wk/" "/workspace/public/"

    <Directory "/workspace/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://app:9000"
        </FilesMatch>
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
